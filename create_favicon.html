<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Favicon</title>
    <style>
        :root {
            --color-primary: #1f4b9c;
            --color-accent: #7fd3f4;
            --color-bg: #f3f7fc;
            --color-text: #0b1629;
        }
        body {
            font-family: sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
        }
    </style>
</head>
<body>
    <h1>Generating favicon...</h1>
    <canvas id="canvas" width="32" height="32"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const styles = getComputedStyle(document.documentElement);
        const palette = {
            background: styles.getPropertyValue('--color-bg').trim() || '#f3f7fc',
            primary: styles.getPropertyValue('--color-primary').trim() || '#1f4b9c',
            accent: styles.getPropertyValue('--color-accent').trim() || '#7fd3f4'
        };

        // Background
        ctx.fillStyle = palette.background;
        ctx.fillRect(0, 0, 32, 32);

        // Mountain path
        ctx.fillStyle = palette.primary;
        ctx.beginPath();
        ctx.moveTo(2, 30);
        ctx.lineTo(10, 16);
        ctx.lineTo(14, 22);
        ctx.lineTo(19, 12);
        ctx.lineTo(28, 30);
        ctx.closePath();
        ctx.fill();

        // Base line
        ctx.strokeStyle = palette.primary;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(2, 30);
        ctx.lineTo(30, 30);
        ctx.stroke();

        // Cyclist dot
        ctx.fillStyle = palette.accent;
        ctx.beginPath();
        ctx.arc(15, 23, 2, 0, Math.PI * 2);
        ctx.fill();

        // Convert to blob and download
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'favicon.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            document.body.innerHTML = '<h1>✅ favicon.png downloaded! Rename it to favicon.ico</h1>';
        });
    </script>
</body>
</html>
